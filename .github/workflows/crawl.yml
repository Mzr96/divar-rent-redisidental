name: crawl

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "فقط پیام تست به تلگرام"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: Restore database from the data branch
        run: |
          if git fetch --depth=1 origin data; then
            git checkout FETCH_HEAD -- divar_rent.db
            sha256sum divar_rent.db > /tmp/db.sha
          else
            echo "No data branch yet: this run records the baseline and sends no alerts."
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Crawl
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT: ${{ github.event_name }}
          TEST_TELEGRAM: ${{ inputs.test_telegram }}
        run: |
          if [ "$TEST_TELEGRAM" = "true" ]; then
            python divar_rent.py --test-telegram
          elif [ "$EVENT" = "schedule" ]; then
            python divar_rent.py --scheduled
          else
            python divar_rent.py
          fi

      - name: Save database to the data branch
        if: always()
        run: |
          [ -f divar_rent.db ] || exit 0
          if [ -f /tmp/db.sha ] && sha256sum -c --status /tmp/db.sha; then
            echo "Database unchanged; nothing to save."
            exit 0
          fi
          mkdir -p /tmp/data
          cp divar_rent.db /tmp/data/
          [ -f report.html ] && cp report.html /tmp/data/
          cd /tmp/data
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
